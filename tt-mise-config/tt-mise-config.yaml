# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json
schemaVersion: "3"
displayName: Mise Configuration (Typist Tech)
description: Configure mise for Typist Tech

kind: mixin

version: 0.0.1

requires: [mise]

provides: [tt-mise-config]

capabilities:
  - type: com.docker.sandbox/network-policy@2
    config:
      install:
        allow: &allow
          - mise-versions.jdx.dev
          - github.com
          - api.github.com
        deny: &deny
          - hosts: [mise-versions.jdx.dev]
            methods: [ANY]
            paths: [/t]
      runtime:
        allow: *allow
        deny: *deny

  - type: com.docker.sandbox/credential@1
    description: GitHub API access for mise
    config:
      service: mise-github
      phase:
        - install
        - runtime
      apiKey:
        name: MISE_GITHUB_TOKEN
        proxyManaged: true
        inject:
          - {domain: api.github.com, header: Authorization, format: "Bearer %s"}
          - {domain: github.com, scheme: basic, username: x-access-token}

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            set -euo pipefail
            mise settings set use_versions_host_track false
            mise settings set minimum_release_age 3d
          user: "1000"
          description: Set mise settings
