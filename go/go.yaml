# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json
schemaVersion: "3"
displayName: Go
description: >-
  Go from the official release archive, with module downloads and
  Go settings prepared for each sandbox
licenses:
  - BSD-3-Clause

kind: mixin

version: "${{ kit.args.version }}"

args:
  version:
    default: "1.27.4"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: Go release to install
    buildArg: GO_VERSION

provides:
  - "go@${{ kit.args.version }}"

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow: &allow
          - proxy.golang.org
          - sum.golang.org
          - storage.googleapis.com
      runtime:
        allow: *allow

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            set -euo pipefail
            cd "$WORKSPACE_DIR"
            [ -f go.mod ] || exit 0
            HOME=/home/agent go mod download
          user: "1000"
          env: [WORKSPACE_DIR, GOPATH]
          description: Download the workspace's Go modules
      files:
        - path: /home/agent/.config/go/env
          overwrite: false
          content: |
            GOPROXY=https://proxy.golang.org
            GOTOOLCHAIN=local
          description: Default Go settings for the agent

  - type: com.docker.sandbox/agent-context@1
    config:
      contentFile: ./go-context.md
