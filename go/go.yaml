# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json
schemaVersion: "3"
displayName: Go
description: Install Go and set up Go environment variables
licenses:
  - BSD-3-Clause

kind: mixin

version: "${{ kit.args.version }}"

args:
  version:
    default: "1.27.4"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: Go release to install
    buildArg: GO_VERSION

provides:
  - "go@${{ kit.args.version }}"

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow: &allow
          - proxy.golang.org
          - sum.golang.org
          - storage.googleapis.com
      runtime:
        allow: *allow

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            set -euo pipefail
            cd "$WORKSPACE_DIR"
            [ -f go.mod ] || exit 0
            # HOME=/home/agent go mod download
          user: "1000"
          env: [WORKSPACE_DIR, GOPATH]
          description: Download the workspace's Go modules
      files:
        - path: /home/agent/.config/go/env
          overwrite: false
          content: |
            GOPROXY=https://proxy.golang.org
            GOTOOLCHAIN=local
          description: Default Go settings for the agent

  - type: com.docker.sandbox/agent-context@1
    config:
      content: |
        ## Go

        Go ${{ kit.args.version }} is installed at `/usr/local/go` and is on `PATH`.

        Modules come from `proxy.golang.org` only: `GOPROXY` has no `direct`
        fallback, so a module that isn't on the proxy fails to download
        instead of being fetched from its Git host.

        `GOTOOLCHAIN` is `local`, so Go never downloads a different toolchain.

        Don't raise the `go` line in `go.mod` above ${{ kit.args.version }}.
