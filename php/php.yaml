# syntax=docker/sandbox-kit:3
# yaml-language-server: $schema=https://raw.githubusercontent.com/docker/sandbox-kit-spec/main/schema/kit.schema.json
schemaVersion: "3"
displayName: php
description: Install PHP and Composer

kind: mixin

version: "${{ kit.args.version }}"

args:
  version:
    default: "8.6.0"
    pattern: '^[0-9]+\.[0-9]+\.[0-9]+$'
    description: PHP release to install
    buildArg: PHP_VERSION

provides: ["php@${{ kit.args.version }}"]

requires:
  - mise
  - tt-mise-config
  - deb/apt
  - deb/coreutils # For `cat` & `tr`

capabilities:
  - type: com.docker.sandbox/network-policy@2
    config:
      install:
        allow:
          # apt
          - deb.debian.org
          - dhi.io
          # mise
          - codeload.github.com
          - composer.github.io
          - getcomposer.org
          - mise-versions.jdx.dev
          - www.php.net
          # composer
          - packagist.org
          - repo.packagist.org
          - api.github.com
          - github.com
        deny: &deny
          - hosts: [packagist.org]
            methods: [ANY]
            paths: [/downloads/]
      runtime:
        allow:
          # composer
          - api.github.com
          - codeload.github.com
          - github.com
          - packagist.org
          - repo.packagist.org
        deny: *deny

  - type: com.docker.sandbox/credential@1
    description: GitHub API access for Composer
    config:
      service: composer-github
      phase:
        - install
        - runtime
      apiKey:
        name: COMPOSER_GITHUB_TOKEN
        proxyManaged: true
        inject:
          - {domain: api.github.com, header: Authorization, format: "Bearer %s"}
          - {domain: github.com, scheme: basic, username: x-access-token}

  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            set -euo pipefail
            apt-get update
            apt-get install --yes --no-install-recommends \
              build-essential \
              autoconf \
              bison \
              re2c \
              pkg-config \
              libxml2-dev \
              libssl-dev \
              libicu-dev \
              libzip-dev \
              libonig-dev \
              libcurl4-openssl-dev \
              libpng-dev \
              libjpeg-dev \
              libfreetype6-dev \
              libwebp-dev \
              libgmp-dev \
              libsodium-dev \
              libreadline-dev \
              libbz2-dev \
              libsqlite3-dev \
              zlib1g-dev
            rm -rf /var/lib/apt/lists/*
          user: "0"
          description: Install PHP prerequisites via apt

        - command: |
            set -euo pipefail
            mise use --global php@${{ kit.args.version }}
            mise cache clear
          env: [MISE_GITHUB_TOKEN]
          user: "1000"
          description: Install PHP and Composer

        - command: |
            mise exec php@${{ kit.args.version }} -- \
              php --version | grep -Fq "PHP ${{ kit.args.version }}"
          user: "1000"
          description: Verify PHP is installed

        - command: |
            set -euo pipefail
            composer_home=$(mise exec php@${{ kit.args.version }} -- composer config --global --absolute home)

            cat > "${composer_home}/keys.dev.pub" <<'EOF'
            -----BEGIN PUBLIC KEY-----
            MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEAnBDHjZS6e0ZMoK3xTD7f
            FNCzlXjX/Aie2dit8QXA03pSrOTbaMnxON3hUL47Lz3g1SC6YJEMVHr0zYq4elWi
            i3ecFEgzLcj+pZM5X6qWu2Ozz4vWx3JYo1/a/HYdOuW9e3lwS8VtS0AVJA+U8X0A
            hZnBmGpltHhO8hPKHgkJtkTUxCheTcbqn4wGHl8Z2SediDcPTLwqezWKUfrYzu1f
            o/j3WFwFs6GtK4wdYtiXr+yspBZHO3y1udf8eFFGcb2V3EaLOrtfur6XQVizjOuk
            8lw5zzse1Qp/klHqbDRsjSzJ6iL6F4aynBc6Euqt/8ccNAIz0rLjLhOraeyj4eNn
            8iokwMKiXpcrQLTKH+RH1JCuOVxQ436bJwbSsp1VwiqftPQieN+tzqy+EiHJJmGf
            TBAbWcncicCk9q2md+AmhNbvHO4PWbbz9TzC7HJb460jyWeuMEvw3gNIpEo2jYa9
            pMV6cVqnSa+wOc0D7pC9a6bne0bvLcm3S+w6I5iDB3lZsb3A9UtRiSP7aGSo7D72
            8tC8+cIgZcI7k9vjvOqH+d7sdOU2yPCnRY6wFh62/g8bDnUpr56nZN1G89GwM4d4
            r/TU7BQQIzsZgAiqOGXvVklIgAMiV0iucgf3rNBLjjeNEwNSTTG9F0CtQ+7JLwaE
            wSEuAuRm+pRqi8BRnQ/GKUcCAwEAAQ==
            -----END PUBLIC KEY-----
            EOF
          user: "1000"
          description: Write Composer dev / snapshot public key

        - command: |
            set -euo pipefail
            composer_home=$(mise exec php@${{ kit.args.version }} -- composer config --global --absolute home)

            cat > "${composer_home}/keys.tags.pub" <<'EOF'
            -----BEGIN PUBLIC KEY-----
            MIICIjANBgkqhkiG9w0BAQEFAAOCAg8AMIICCgKCAgEA0Vi/2K6apCVj76nCnCl2
            MQUPdK+A9eqkYBacXo2wQBYmyVlXm2/n/ZsX6pCLYPQTHyr5jXbkQzBw8SKqPdlh
            vA7NpbMeNCz7wP/AobvUXM8xQuXKbMDTY2uZ4O7sM+PfGbptKPBGLe8Z8d2sUnTO
            bXtX6Lrj13wkRto7st/w/Yp33RHe9SlqkiiS4MsH1jBkcIkEHsRaveZzedUaxY0M
            mba0uPhGUInpPzEHwrYqBBEtWvP97t2vtfx8I5qv28kh0Y6t+jnjL1Urid2iuQZf
            noCMFIOu4vksK5HxJxxrN0GOmGmwVQjOOtxkwikNiotZGPR4KsVj8NnBrLX7oGuM
            nQvGciiu+KoC2r3HDBrpDeBVdOWxDzT5R4iI0KoLzFh2pKqwbY+obNPS2bj+2dgJ
