            tl2IxiEnejnOmAzGVivE1YGduYBjN+mjxDVy8KGBrjnz1JPgAvgdwJ2dYw4Rsc/e
            TzCFWGk/HM6a4f0IzBWbJ5ot0PIi4amk07IotBXDWwqDiQTwyuGCym5EqWQ2BD95
            RGv89BPD+2DLnJysngsvVaUCAwEAAQ==
            -----END PUBLIC KEY-----
            EOF
          user: "1000"
          description: Write Composer tags public key

        - command: |
            mise exec php@${{ kit.args.version }} -- \
              composer config --global github-oauth.github.com "${COMPOSER_GITHUB_TOKEN}"
          env: [COMPOSER_GITHUB_TOKEN]
          user: "1000"
          description: Set up GitHub oauth access for Composer

        - command: |
            mise exec php@${{ kit.args.version }} -- \
              composer config --global notify-on-install false

            mise exec php@${{ kit.args.version }} -- \
              composer config --global store-auths false
          user: "1000"
          description: Set Composer global settings

        - command: |
            set -euo pipefail
            diagnose=$(mise exec php@${{ kit.args.version }} -- composer diagnose)

            printf '%s' "$diagnose"

            printf '%s' "$diagnose" | tr -s '[:space:]' ' ' | grep -Fq \
              'Tags Public Key Fingerprint: 57815BA2 7E54DC31 7ECC7CC5 573090D0 87719BA6 8F3BB723 4E5D42D0 84A14642'

            printf '%s' "$diagnose" | tr -s '[:space:]' ' ' | grep -Fq \
              'Dev Public Key Fingerprint: 4AC45767 E5EC2265 2F0C1167 CBBB8A2B 0C708369 153E328C AD90147D AFE50952'

            printf '%s' "$diagnose" | grep -Fq \
              'PHP version: ${{ kit.args.version }}'

            printf '%s' "$diagnose" | grep -Fq \
              'github.com oauth access: OK'
          user: "1000"
          description: Verify Composer is installed

        - command: |
            set -euo pipefail
            cd "$WORKSPACE_DIR"
            [ -f composer.json ] || exit 0
            mise exec php@${{ kit.args.version }} -- composer install --download-only
          user: "1000"
          env: [WORKSPACE_DIR]
          description: Download the workspace's Composer packages

  - type: com.docker.sandbox/agent-context@2
    config:
      content: |
        ## PHP

        PHP ${{ kit.args.version }} and Composer are installed via `mise` and are on `PATH`.

        Composer is authenticated to GitHub. The credentials are managed by the sandbox proxy.

        Don't raise the minimum PHP requirement `composer.json` above ${{ kit.args.version }}.

        Don't install another version of PHP nor Composer.
