# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: workload
displayName: Dev

capabilities:
  - type: com.docker.sandbox/sbx@1
  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - mise.en.dev:443
          - cache.ruby-lang.org
          - go.dev:443
          - github.com:443
          - api.github.com:443
  - type: com.docker.sandbox/credential@1
    config:
      service: github
      phase: runtime
      apiKey:
        name: GITHUB_TOKEN
        proxyManaged: true
        inject:
          - domain: api.github.com
            header: Authorization
            format: "Bearer %s"
          - domain: github.com
            scheme: basic
            username: x-access-token
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        # Git
        - command: |
            set -euo pipefail
            git config --global user.name "TangRufus"
            git config --global user.email tangrufus@gmail.com
            git config --global alias.co checkout
            git config --global alias.br branch
            git config --global alias.ci commit
            git config --global alias.st status
            git config --global alias.lg "log --date=auto:human --color --graph --pretty=format:'%Cred%h%Creset -%C(yellow)%d%Creset %s %Cgreen(%cd) %C(bold blue)<%an>%Creset' --abbrev-commit"
            git config --global color.ui true
            git config --global init.defaultbranch main
          user: "1000"

        # Go
        - command: |
            set -euo pipefail
            go telemetry off
          user: "1000"

        # rtk
        - command: |
            set -euo pipefail
            mkdir -p ~/.local/share
            ln -s /Users/work/Developer/Agents/rtk/share ~/.local/share/rtk

            mise exec -- rtk telemetry disable
          user: "1000"
