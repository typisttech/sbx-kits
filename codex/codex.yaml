# syntax=docker/sandbox-kit:3
schemaVersion: "3"
kind: mixin
displayName: Codex

capabilities:
  - type: com.docker.sandbox/network-policy@1
    config:
      install:
        allow:
          - chatgpt.com:443
          - github.com:443
          - api.github.com:443
      runtime:
        allow:
          - chatgpt.com:443
          - github.com:443
          - api.github.com:443
  - type: com.docker.sandbox/lifecycle@1
    config:
      install:
        - command: |
            set -euo pipefail
            curl -fsSL https://chatgpt.com/codex/install.sh | CODEX_NON_INTERACTIVE=1 sh
          user: "1000"
          description: Install Codex
